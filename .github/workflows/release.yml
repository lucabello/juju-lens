name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for `git describe`

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: extractions/setup-just@v2

      - run: just dist

      - run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
